<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag! You’re It!</title>
<style>
  :root{
    --blue:#0a1f8f; --blue-hi:#1637d6; --gold:#ffcc33; --ink:#050b3a; --white:#f7f9ff;
    --green:#2fd27a; --red:#ff5b5b; --panel:#0d1750;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--white);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  body{background:radial-gradient(1200px 700px at 50% -10%,#1a2bb8 0%,var(--ink) 65%) fixed}
  button{font:inherit;color:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* ---------- setup ---------- */
  #setup{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px;text-align:center}
  #setup h1{font-family:"Arial Black",Impact,sans-serif;font-size:clamp(40px,7vw,96px);letter-spacing:2px;margin:0;
    color:var(--gold);text-shadow:0 4px 0 #7a5a00,0 10px 30px rgba(0,0,0,.5)}
  #setup p{margin:0;font-size:clamp(16px,2vw,24px);color:#c9d2ff}
  .team-count{display:flex;gap:12px;align-items:center;justify-content:center}
  .team-count button{width:56px;height:56px;border-radius:50%;border:2px solid #5568ff;background:var(--panel);font-size:24px;font-weight:700}
  .team-count button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  #nameInputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:min(900px,100%)}
  #nameInputs input{padding:14px 16px;border-radius:12px;border:2px solid #3447d4;background:var(--panel);color:var(--white);font:inherit;font-size:20px;text-align:center}
  .big{background:var(--gold);color:var(--ink);border:0;border-radius:14px;padding:16px 40px;font-size:24px;font-weight:800;box-shadow:0 5px 0 #a8820a}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #a8820a}
  .ghost{background:transparent;border:2px solid #5568ff;border-radius:10px;padding:8px 14px;font-size:15px}

  /* ---------- board ---------- */
  #game{display:flex;flex-direction:column;min-height:100vh;padding:16px 20px 14px;gap:14px}
  #bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  #bar h2{margin:0;font-family:"Arial Black",Impact,sans-serif;color:var(--gold);font-size:clamp(20px,2.4vw,32px);letter-spacing:1px}
  #bar .tools{display:flex;gap:8px}
  #board{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;min-height:0}
  .cat{background:var(--blue-hi);border:2px solid #000;border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:10px 8px;font-weight:800;text-transform:uppercase;font-size:clamp(13px,1.7vw,26px);line-height:1.1;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.5);min-height:78px}
  .tile{background:var(--blue);border:2px solid #000;border-radius:6px;color:var(--gold);font-family:"Arial Black",Impact,sans-serif;
    font-size:clamp(28px,4.6vw,76px);text-shadow:0 3px 0 rgba(0,0,0,.6);transition:transform .08s,background .15s}
  .tile:hover:not(:disabled){background:#1a36c8;transform:scale(1.03)}
  .tile:disabled{background:#050a33;color:transparent;text-shadow:none;cursor:default;opacity:.55}
  #teams{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .team{min-width:190px;background:var(--panel);border:2px solid #2b3fc4;border-radius:12px;padding:8px 18px;text-align:center}
  .team .n{font-size:15px;color:#c9d2ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
  .team .s{font-family:"Arial Black",Impact,sans-serif;font-size:34px;line-height:1.1}
  .team .s.neg{color:var(--red)}
  .team.turn{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,204,51,.35)}

  /* ---------- clue modal ---------- */
  #clue{position:fixed;inset:0;background:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 6vw;text-align:center;z-index:10}
  #clueMeta{font-family:"Arial Black",Impact,sans-serif;color:var(--gold);font-size:clamp(18px,2.4vw,34px);letter-spacing:1px;text-transform:uppercase}
  #clueText{font-size:clamp(28px,4.4vw,64px);font-weight:700;line-height:1.2;max-width:1400px;text-shadow:0 3px 0 rgba(0,0,0,.45)}
  #clueAns{font-size:clamp(26px,3.8vw,54px);font-weight:800;color:var(--gold);max-width:1400px;line-height:1.2}
  #clueNote{font-size:clamp(16px,1.8vw,24px);color:#c9d2ff;max-width:1100px}
  #clueActions{display:flex;flex-direction:column;gap:14px;align-items:center}
  .award{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .award button{background:var(--panel);border:2px solid #5568ff;border-radius:12px;padding:10px 18px;font-size:18px;min-width:170px}
  .award .name{font-weight:700;display:block;margin-bottom:6px}
  .award .pm{display:flex;gap:6px;justify-content:center}
  .award .pm button{min-width:0;padding:6px 14px;font-weight:800;font-size:20px}
  .award .pm .ok{background:var(--green);color:#04210f;border-color:var(--green)}
  .award .pm .no{background:var(--red);color:#2a0505;border-color:var(--red)}
  .award .pm button.used{outline:3px solid var(--white)}
  #dd{font-family:"Arial Black",Impact,sans-serif;color:var(--gold);font-size:clamp(40px,8vw,120px);animation:pulse 1s infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
  .wager{display:flex;gap:10px;align-items:center;font-size:20px}
  .wager input,.wager select{font:inherit;font-size:22px;padding:8px 12px;border-radius:10px;border:2px solid #5568ff;background:var(--panel);color:var(--white);width:150px}
  .wager select{width:220px}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .hint{position:absolute;bottom:14px;font-size:14px;color:#8d9be8}

  /* ---------- timer + tag banner ---------- */
  #timerWrap{width:min(900px,80vw);display:flex;align-items:center;gap:16px}
  #timerBar{flex:1;height:18px;background:#06125f;border-radius:99px;overflow:hidden;border:2px solid #000}
  #timerFill{height:100%;width:100%;background:var(--green);transition:background .3s}
  #timerNum{font-family:"Arial Black",Impact,sans-serif;font-size:36px;min-width:64px;text-align:right}
  #tagBanner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;pointer-events:none;
    background:rgba(5,11,58,.55);font-family:"Arial Black",Impact,sans-serif;text-align:center;opacity:0}
  #tagBanner.show{animation:tagpop 1.6s ease both}
  #tagBanner span{display:block;font-size:clamp(28px,4vw,56px);color:#fff;margin-top:8px}
  #tagBanner b{display:block;font-size:clamp(60px,12vw,190px);color:var(--gold);text-shadow:0 6px 0 #7a5a00;line-height:1}
  @keyframes tagpop{0%{opacity:0;transform:scale(.6) rotate(-6deg)}15%{opacity:1;transform:scale(1.08) rotate(2deg)}25%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}

  /* ---------- final ---------- */
  #winner{font-family:"Arial Black",Impact,sans-serif;font-size:clamp(34px,6vw,90px);color:var(--gold)}
</style>
</head>
<body>

<!-- SETUP -->
<section id="setup">
  <h1>TAG!<br>YOU’RE IT!</h1>
  <p>Tag question Jeopardy &middot; section 11.4 &middot; isn’t it?</p>
  <div>
    <p style="margin-bottom:10px">How many teams?</p>
    <div class="team-count" id="teamCount"></div>
  </div>
  <div id="nameInputs"></div>
  <button class="big" id="startBtn">Start game</button>
  <button class="ghost hidden" id="resumeBtn">Resume saved game</button>
</section>

<!-- GAME -->
<section id="game" class="hidden">
  <div id="bar">
    <h2>TAG! YOU’RE IT!</h2>
    <div class="tools">
      <button class="ghost" id="timerBtn">Timer: on</button>
      <button class="ghost" id="muteBtn">Sound: on</button>
      <button class="ghost" id="finalBtn">Final round</button>
      <button class="ghost" id="newBtn">New game</button>
    </div>
  </div>
  <div id="board"></div>
  <div id="teams"></div>
</section>

<!-- CLUE OVERLAY -->
<div id="clue" class="hidden">
  <div id="clueMeta"></div>
  <div id="dd" class="hidden">DAILY DOUBLE!</div>
  <div id="ddSetup" class="wager hidden"></div>
  <div id="timerWrap" class="hidden"><div id="timerBar"><div id="timerFill"></div></div><div id="timerNum"></div></div>
  <div id="clueText"></div>
  <div id="clueAns" class="hidden"></div>
  <div id="clueNote" class="hidden"></div>
  <div id="clueActions"></div>
  <div class="hint">Space = reveal &middot; Esc = back to board</div>
</div>

<div id="tagBanner"><div><b>TAG!</b><span id="tagWho"></span></div></div>

<script>
/* =====================================================================
   EDIT YOUR CLUES HERE.
   Each category has 5 clues (worth 100–500). "a" is the answer, written
   Jeopardy-style. "note" (optional) shows under the answer.
   ===================================================================== */
const VALUES = [100, 200, 300, 400, 500];

const CATEGORIES = [
  { name: "Tag Basics", clues: [
    { q: "A short question added to the end of a statement, like “isn’t it?” or “right?”",
      a: "What is a tag question?" },
    { q: "In “You’ve never met my kids, have you?” this part, “have you?”, is the tag. The part before it is called this.",
      a: "What is the statement (the content)?",
      note: "You answer the content, not the tag." },
    { q: "In the classic form, an affirmative statement like “It’s cold” gets this kind of tag.",
      a: "What is a negative tag (“isn’t it?”)?",
      note: "Reversed polarity: positive statement → negative tag, and vice versa." },
    { q: "Moore and Podesva (2009) call tags this, because they nudge the hearer toward agreeing.",
      a: "What is conducive?" },
    { q: "Moore and Podesva (2009) say agreeing with something already on the table is easier than doing this.",
      a: "What is constructing dissent (building an objection)?" }
  ]},
  { name: "Three Types", clues: [
    { q: "“Today is Thursday, isn’t it?” is an example of this type of tag.",
      a: "What is a reversed-polarity (actual) tag?" },
    { q: "“Tell them I said hello, will you?” is a tag added to this kind of sentence.",
      a: "What is an imperative (a command)?" },
    { q: "“Right,” “okay” and “yeah” at the end of a statement, usually with rising intonation, are examples of this type of tag.",
      a: "What are discourse particles?" },
    { q: "Tags on imperatives generally start with one of these kinds of words, such as will, shall, can or would.",
      a: "What is a modal?" },
    { q: "Biber et al. (1999): modal-marked tags tend to signal this.",
      a: "What is a higher register and sometimes a stronger sense of urging?" }
  ]},
  { name: "Answer It Right", clues: [
    { q: "“You’ve never met my kids, have you?” The typical answer starts with this word.",
      a: "What is “No”? (“No, I haven’t yet.”)" },
    { q: "True or false: when answering a tag question, you answer the content of the statement, not the tag.",
      a: "What is true?" },
    { q: "“You’re not Brian, are you?” Give one typical answer.",
      a: "What is “Yes, I am.” or “No, I’m Bob. Brian is my brother.”?",
      note: "Both track the content of the statement." },
    { q: "“Yes (you are right), I’m Abdul” gets an asterisk in the chapter because it comments on this instead of answering the content.",
      a: "What is whether the whole tag question is right?",
      note: "Marked as not typical." },
    { q: "A learner answers “You haven’t met Sunjun, right?” with “Yes, I haven’t.” This common bump agrees with this part of the question.",
      a: "What is the tag?",
      note: "The typical answer is “No, I haven’t.”" }
  ]},
  { name: "Across Englishes", clues: [
    { q: "Hawaiian pidgin: “It’s tasty, ____?”",
      a: "What is “yeah”?" },
    { q: "This tag is strongly associated with Canadian English.",
      a: "What is “Eh?”" },
    { q: "Some British dialects use this tag.",
      a: "What is “Innit?”" },
    { q: "These two varieties of English share the tag “Eh?”",
      a: "What are Canadian English and Maori English?" },
    { q: "Compared with other Englishes, British English in general uses tag questions this way, per Bell (2001).",
      a: "What is more often, with slightly different patterns and meanings?" }
  ]},
  { name: "Tag It Yourself", clues: [
    { q: "Add a reversed-polarity tag: “She’s coming tonight, ____?”",
      a: "What is “isn’t she?”" },
    { q: "Add a reversed-polarity tag: “You didn’t forget the tickets, ____?”",
      a: "What is “did you?”",
      note: "Negative statement → positive tag." },
    { q: "Add a modal tag to the command: “Close the door, ____?”",
      a: "What is “will you?” (or would you / can you)?" },
    { q: "Turn this into a discourse-particle tag: “The paper is due tomorrow, ____?”",
      a: "What is “right?” (or okay? / yeah?)" },
    { q: "Say why a speaker might end a claim with “right?”",
      a: "What is to invite the hearer to agree?",
      note: "Tags are conducive: they bid for agreement." }
  ]}
];

const TIMER_SECONDS = 30;   // change this to give teams more or less time

const FINAL = {
  category: "Final Jeopardy: The Big Picture",
  q: "Name the three types of tags covered in section 11.4.",
  a: "What are reversed-polarity tags, discourse particles, and modal tags on imperatives?"
};

/* ===================== game code ===================== */
const $ = id => document.getElementById(id);
const SAVE_KEY = "tagJeopardy.v1";
let state = null;          // { teams:[{name,score}], used:{ "c-r":true }, dd:"c-r", turn:0 }
let nTeams = 3;
let current = null;        // clue in play

function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); }catch(e){ return null; } }

/* ---- sound ---- */
let audio = null, soundOn = true, timerOn = true;
try{ soundOn = localStorage.getItem("tagJeopardy.sound")!=="off"; timerOn = localStorage.getItem("tagJeopardy.timer")!=="off"; }catch(e){}
function ctx(){ if(!soundOn) return null; try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==="suspended") audio.resume(); return audio; }catch(e){ return null; } }
function tone(freq, dur, type="sine", when=0, vol=.18, slideTo){
  const a = ctx(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
const sfx = {
  tick(){ tone(900,.06,"square",0,.07); },
  buzz(){ tone(130,.7,"sawtooth",0,.22); tone(98,.7,"square",0,.12); },
  good(){ tone(660,.14,"triangle"); tone(880,.14,"triangle",.12); tone(1320,.3,"triangle",.24); },
  bad(){ tone(300,.3,"sawtooth",0,.15,120); },
  tag(){ tone(400,.18,"square",0,.12,1200); tone(1200,.12,"triangle",.2); tone(1600,.2,"triangle",.3); },
  dd(){ [523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.16,"triangle",i*.13,.17)); },
  reveal(){ tone(520,.1,"triangle"); tone(780,.18,"triangle",.09); }
};
function paintToggles(){ $("muteBtn").textContent = "Sound: "+(soundOn?"on":"off"); $("timerBtn").textContent = "Timer: "+(timerOn?"on":"off"); }
$("muteBtn").onclick = ()=>{ soundOn=!soundOn; try{localStorage.setItem("tagJeopardy.sound",soundOn?"on":"off");}catch(e){} paintToggles(); if(soundOn) sfx.tick(); };
$("timerBtn").onclick = ()=>{ timerOn=!timerOn; try{localStorage.setItem("tagJeopardy.timer",timerOn?"on":"off");}catch(e){} paintToggles(); };

/* ---- countdown ---- */
let tInt = null;
function stopTimer(){ clearInterval(tInt); tInt = null; }
function startTimer(){
  stopTimer(); const wrap = $("timerWrap");
  if(!timerOn){ wrap.classList.add("hidden"); return; }
  wrap.classList.remove("hidden");
  let left = TIMER_SECONDS; const fill = $("timerFill"), num = $("timerNum");
  const paint = ()=>{ num.textContent = left; fill.style.width = (left/TIMER_SECONDS*100)+"%";
    fill.style.background = left<=5 ? "var(--red)" : left<=10 ? "var(--gold)" : "var(--green)"; };
  paint();
  tInt = setInterval(()=>{
    left--; paint();
    if(left>0 && left<=5) sfx.tick();
    if(left<=0){ stopTimer(); sfx.buzz(); }
  },1000);
}

/* ---- "Tag! You're it!" banner ---- */
function tagBanner(i){
  $("tagWho").textContent = state.teams[i].name + ", you’re it!";
  const b = $("tagBanner"); b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
  sfx.tag();
}

/* ---- setup ---- */
function renderCount(){
  const el = $("teamCount"); el.innerHTML = "";
  [1,2,3,4,5,6].forEach(n=>{
    const b = document.createElement("button"); b.textContent = n;
    if(n===nTeams) b.className = "on";
    b.onclick = ()=>{ nTeams = n; renderCount(); renderNames(); };
    el.appendChild(b);
  });
}
function renderNames(){
  const old = [...document.querySelectorAll("#nameInputs input")].map(i=>i.value);
  const box = $("nameInputs"); box.innerHTML = "";
  for(let i=0;i<nTeams;i++){
    const inp = document.createElement("input");
    inp.placeholder = "Team " + (i+1); inp.value = old[i]||""; inp.maxLength = 22;
    box.appendChild(inp);
  }
}
$("startBtn").onclick = ()=>{
  const names = [...document.querySelectorAll("#nameInputs input")].map((i,k)=> i.value.trim() || ("Team "+(k+1)));
  const dd = Math.floor(Math.random()*5) + "-" + (1+Math.floor(Math.random()*4)); // never the 100 row
  state = { teams: names.map(n=>({name:n,score:0})), used:{}, dd, turn:0 };
  save(); showGame();
};
$("resumeBtn").onclick = ()=>{ state = load(); if(state) showGame(); };
$("newBtn").onclick = ()=>{ if(confirm("Start a new game? Scores will be cleared.")){ state=null; try{localStorage.removeItem(SAVE_KEY);}catch(e){} showSetup(); } };

function showSetup(){
  $("game").classList.add("hidden"); $("setup").classList.remove("hidden");
  $("resumeBtn").classList.toggle("hidden", !load());
}
function showGame(){
  $("setup").classList.add("hidden"); $("game").classList.remove("hidden");
  renderBoard(); renderTeams();
}

/* ---- board ---- */
function renderBoard(){
  const b = $("board"); b.innerHTML = "";
  CATEGORIES.forEach(c=>{ const d = document.createElement("div"); d.className="cat"; d.textContent=c.name; b.appendChild(d); });
  for(let r=0;r<5;r++){
    CATEGORIES.forEach((c,ci)=>{
      const key = ci+"-"+r, t = document.createElement("button");
      t.className="tile"; t.textContent = "$"+VALUES[r];
      t.disabled = !!state.used[key];
      t.onclick = ()=>openClue(ci,r);
      b.appendChild(t);
    });
  }
}
function renderTeams(){
  const t = $("teams"); t.innerHTML = "";
  state.teams.forEach((tm,i)=>{
    const d = document.createElement("div"); d.className = "team" + (i===state.turn?" turn":"");
    d.innerHTML = '<div class="n"></div><div class="s"></div>';
    d.querySelector(".n").textContent = tm.name;
    const s = d.querySelector(".s"); s.textContent = (tm.score<0?"-":"")+"$"+Math.abs(tm.score); if(tm.score<0) s.classList.add("neg");
    d.title = "Click to make this team's turn"; d.style.cursor="pointer";
    d.onclick = ()=>{ state.turn=i; save(); renderTeams(); };
    t.appendChild(d);
  });
}

/* ---- clue ---- */
function openClue(ci,r){
  const key = ci+"-"+r, cat = CATEGORIES[ci], clue = cat.clues[r];
  current = { key, ci, r, value: VALUES[r], clue, revealed:false, dd: state.dd===key, wager: VALUES[r], team: state.turn, marks:{} };
  state.used[key] = true; save(); renderBoard();
  $("clueMeta").textContent = cat.name + " · $" + VALUES[r];
  $("clueText").textContent = ""; $("clueAns").classList.add("hidden"); $("clueNote").classList.add("hidden");
  $("clueActions").innerHTML = "";
  $("dd").classList.toggle("hidden", !current.dd);
  $("ddSetup").classList.add("hidden");
  $("clue").classList.remove("hidden");
  if(current.dd){ sfx.dd(); setupDailyDouble(); } else showQuestion();
}
function setupDailyDouble(){
  const w = $("ddSetup"); w.classList.remove("hidden");
  const max = Math.max(1000, ...state.teams.map(t=>t.score));
  w.innerHTML = "";
  const sel = document.createElement("select");
  state.teams.forEach((t,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=t.name; if(i===state.turn) o.selected=true; sel.appendChild(o); });
  const inp = document.createElement("input"); inp.type="number"; inp.min=5; inp.max=max; inp.value=Math.min(max, 500);
  const go = document.createElement("button"); go.className="big"; go.style.fontSize="20px"; go.style.padding="10px 26px"; go.textContent="Lock wager";
  const lab1 = document.createElement("span"); lab1.textContent="Team:";
  const lab2 = document.createElement("span"); lab2.textContent="Wager $";
  w.append(lab1, sel, lab2, inp, go);
  go.onclick = ()=>{
    current.team = +sel.value; current.wager = Math.max(5, Math.min(max, +inp.value||5));
    $("dd").classList.add("hidden"); w.classList.add("hidden"); showQuestion();
  };
}
function showQuestion(){
  $("clueText").textContent = current.clue.q;
  const acts = $("clueActions"); acts.innerHTML = "";
  const rev = document.createElement("button"); rev.className="big"; rev.textContent="Reveal answer"; rev.onclick = reveal;
  acts.appendChild(rev);
  startTimer();
}
function reveal(){
  if(current.revealed) return; current.revealed = true; stopTimer(); sfx.reveal();
  $("clueAns").textContent = current.clue.a; $("clueAns").classList.remove("hidden");
  if(current.clue.note){ $("clueNote").textContent = current.clue.note; $("clueNote").classList.remove("hidden"); }
  const acts = $("clueActions"); acts.innerHTML = "";
  const aw = document.createElement("div"); aw.className = "award";
  const teamsToShow = current.dd ? [current.team] : state.teams.map((_,i)=>i);
  teamsToShow.forEach(i=>{
    const tm = state.teams[i], card = document.createElement("div");
    card.innerHTML = '<span class="name"></span><div class="pm"><button class="no">−</button><button class="ok">+</button></div>';
    card.querySelector(".name").textContent = tm.name;
    const amt = current.dd ? current.wager : current.value;
    const [no, ok] = card.querySelectorAll("button");
    const apply = sign => {
      const prev = current.marks[i] || 0; tm.score += sign*amt - prev; current.marks[i] = sign*amt;
      no.classList.toggle("used", sign<0); ok.classList.toggle("used", sign>0);
      if(sign>0){ state.turn = i; current.tagTo = i; sfx.good(); }
      else { sfx.bad(); if(current.tagTo===undefined || current.dd) current.tagTo = (i+1) % state.teams.length; }
      save(); renderTeams();
    };
    ok.onclick = ()=>apply(+1); no.onclick = ()=>apply(-1);
    aw.appendChild(card);
  });
  const done = document.createElement("button"); done.className="big"; done.textContent="Back to board"; done.onclick = closeClue;
  const nobody = document.createElement("div"); nobody.style.cssText="color:#c9d2ff;font-size:16px";
  nobody.textContent = current.dd ? "Daily Double: " + state.teams[current.team].name + " wagered $"+current.wager+"." : "Tap + for the team that got it, − for a miss. Nobody? Just go back.";
  acts.append(aw, nobody, done);
}
function closeClue(){
  stopTimer(); $("timerWrap").classList.add("hidden");
  const to = current && current.tagTo;
  $("clue").classList.add("hidden");
  if(to!==undefined && state){ state.turn = to; save(); }
  current = null; renderBoard(); renderTeams();
  if(to!==undefined && state) tagBanner(to);
}

/* ---- final ---- */
$("finalBtn").onclick = ()=>{
  current = { final:true, revealed:false }; $("timerWrap").classList.add("hidden"); stopTimer();
  $("clueMeta").textContent = FINAL.category;
  $("dd").classList.add("hidden"); $("ddSetup").classList.add("hidden");
  $("clueText").textContent = FINAL.q;
  $("clueAns").classList.add("hidden"); $("clueNote").classList.add("hidden");
  const acts = $("clueActions"); acts.innerHTML = "";
  const rev = document.createElement("button"); rev.className="big"; rev.textContent="Reveal answer";
  rev.onclick = ()=>{
    current.revealed = true;
    $("clueAns").textContent = FINAL.a; $("clueAns").classList.remove("hidden");
    acts.innerHTML = "";
    const top = [...state.teams].sort((a,b)=>b.score-a.score);
    const tied = top.filter(t=>t.score===top[0].score);
    const w = document.createElement("div"); w.id="winner";
    w.textContent = (tied.length>1 ? "It’s a tie: " : "Winner: ") + tied.map(t=>t.name).join(" & ") + " ($" + top[0].score + ")";
    const back = document.createElement("button"); back.className="big"; back.textContent="Back to board"; back.onclick=closeClue;
    acts.append(w, back);
  };
  acts.appendChild(rev);
  $("clue").classList.remove("hidden");
};

/* ---- keys ---- */
document.addEventListener("keydown", e=>{
  if($("clue").classList.contains("hidden")) return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(e.key==="Escape") closeClue();
  if(e.key===" " && current && !current.revealed && $("ddSetup").classList.contains("hidden") && $("dd").classList.contains("hidden")){
    e.preventDefault();
    if(current.final) $("clueActions").querySelector("button").click(); else reveal();
  }
});

/* ---- boot ---- */
paintToggles(); renderCount(); renderNames(); showSetup();
</script>
</body>
</html>
